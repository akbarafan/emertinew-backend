basePath: /api
definitions:
  auth.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  device.CreateDeviceRequest:
    properties:
      name:
        example: GPS Module A1
        type: string
      sensor_id:
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      type:
        enum:
        - top
        - bottom
        example: top
        type: string
    required:
    - name
    - type
    type: object
  device.UpdateDeviceRequest:
    properties:
      name:
        example: GPS Module A1 Updated
        type: string
      sensor_id:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      type:
        enum:
        - top
        - bottom
        example: bottom
        type: string
    type: object
  sensor.CreateSensorRequest:
    properties:
      code:
        example: GPS001
        type: string
      name:
        example: GPS Sensor 1
        type: string
      topic:
        example: sensor/gps/001
        type: string
    required:
    - code
    - name
    - topic
    type: object
  sensor.UpdateSensorRequest:
    properties:
      code:
        example: GPS002
        type: string
      name:
        example: GPS Sensor 2
        type: string
      topic:
        example: sensor/gps/002
        type: string
    type: object
  user.CreateUserRequest:
    properties:
      password:
        example: password123
        minLength: 6
        type: string
      role:
        enum:
        - superadmin
        - admin
        - guest
        example: admin
        type: string
      username:
        example: newuser
        type: string
    required:
    - password
    - role
    - username
    type: object
  user.UpdateUserRequest:
    properties:
      password:
        example: newpassword123
        minLength: 6
        type: string
      role:
        enum:
        - superadmin
        - admin
        - guest
        example: guest
        type: string
      username:
        example: updateduser
        type: string
    type: object
  vessel.CreateVesselRequest:
    properties:
      device_id:
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      is_active:
        example: true
        type: boolean
      name:
        example: KM Nusantara 01
        type: string
    required:
    - name
    type: object
  vessel.UpdateVesselRequest:
    properties:
      device_id:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      is_active:
        example: false
        type: boolean
      name:
        example: KM Nusantara 01 Updated
        type: string
    type: object
host: localhost:6969
info:
  contact:
    email: support@emerti.com
    name: API Support
  description: Production-ready backend API untuk sistem Emerti dengan MQTT integration,
    JWT authentication, dan PostgreSQL database.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Emerti Backend API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login dengan username dan password untuk mendapatkan JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'success: true, data: {token, user}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'error: Invalid request'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: invalid credentials'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Logout dan invalidate session JWT token
      produces:
      - application/json
      responses:
        "200":
          description: 'success: true, message: Logout successful'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 'error: Unauthorized'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: User logout
      tags:
      - Authentication
